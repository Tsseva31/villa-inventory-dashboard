<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Villa Inventory Dashboard v3</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/styles.css?v=3">
</head>
<body>
  <div id="api-warning" style="background:#ff4444;color:white;padding:8px 16px;text-align:center;font-size:14px;display:none;">
    ⚠️ API недоступен — показаны демо-данные / API unavailable — showing demo data
  </div>

  <!-- Header with filters -->
  <header class="header">
    <h1>Villa Inventory Dashboard</h1>
    <div class="filters">
      <select id="filter-category">
        <option value="">All categories</option>
        <!-- Populated from JS -->
      </select>
      <select id="filter-condition">
        <!-- Options populated from CONFIG.CONDITIONS in app.js (Все + 5 conditions) -->
      </select>
      <input type="text" id="filter-search" placeholder="Search...">
      <select id="filter-room" title="Фильтр по комнате">
        <option value="">Все комнаты</option>
      </select>
    </div>
  </header>

  <!-- Building / floor tabs -->
  <nav class="building-tabs" id="building-tabs">
    <button class="tab-btn active" data-building="mc">MC</button>
    <button class="tab-btn" data-building="mv-living">MV Жилая</button>
    <button class="tab-btn" data-building="mv-spa">MV Спа</button>
    <button class="tab-btn" data-building="sg-lower">SG ↓</button>
    <button class="tab-btn" data-building="sg-upper">SG ↑</button>
    <button class="tab-btn" data-building="ga1">GA1</button>
    <button class="tab-btn" data-building="ga2">GA2</button>
    <button class="tab-btn" data-building="ent">ENT</button>
    <button class="tab-btn" data-building="staff">Staff</button>
    <button class="tab-btn" data-building="site">Site</button>
    <button class="tab-btn" data-building="str">Склад</button>
    <button class="tab-btn" data-building="all">📊 Все</button>
    <button class="tab-btn" data-building="requests">📋 Запросы</button>
    <div class="view-toggle">
      <button class="view-btn active" data-view="map" title="Карта">🗺️</button>
      <button class="view-btn" data-view="list" title="Список">📋</button>
    </div>
  </nav>

  <div id="stats-header" class="stats-header" style="display:none;">
    <div class="stats-bar">
      <div class="stat-item" id="stat-items-wrap">
        <span class="stat-value" id="stat-total-items">0</span>
        <span class="stat-label">предметов</span>
      </div>
      <div class="stat-item" id="stat-rooms-wrap">
        <span class="stat-value" id="stat-total-rooms">0</span>
        <span class="stat-label">комнат</span>
      </div>
      <div class="stat-item stat-warning" id="stat-repairs-wrap">
        <span class="stat-value" id="stat-repairs">0</span>
        <span class="stat-label">ремонтов</span>
      </div>
      <div class="stat-item stat-danger" id="stat-requests-wrap">
        <span class="stat-value" id="stat-requests">0</span>
        <span class="stat-label">запросов</span>
      </div>
    </div>
  </div>

  <!-- Main content -->
  <main class="main">
    <!-- Map -->
    <div class="map-container" id="map-container">
      <div class="map-wrapper">
        <img src="assets/floor-plan-mc-1f.png" alt="Floor Plan" id="floor-plan">
        <svg id="pins-layer" class="pins-layer"></svg>
      </div>
      <div id="tooltip" class="tooltip hidden"></div>
    </div>

    <!-- List view -->
    <div class="list-container hidden" id="list-container">
      <div class="category-chips" id="category-chips" style="display:none;"></div>
      <div class="list-stats" id="list-stats"></div>
      <div class="list-table-wrapper">
        <table class="inventory-table" id="inventory-table">
          <thead>
            <tr>
              <th>Комната</th>
              <th>Категория</th>
              <th>Описание</th>
              <th>Состояние</th>
              <th>Кол-во</th>
              <th>Фото</th>
              <th>Дата</th>
            </tr>
          </thead>
          <tbody id="inventory-tbody"></tbody>
        </table>
      </div>
    </div>

    <section id="room-view-container" class="room-view hidden">
      <div class="room-view-header">
        <button id="room-view-back" class="room-view-back" type="button">← назад к плану</button>
        <h2 id="room-view-title"></h2>
      </div>
      <div class="room-view-meta">
        <div id="room-view-counters" class="room-view-counters"></div>
        <div id="room-view-completeness" class="room-view-completeness"></div>
        <div id="room-view-conditions" class="room-view-conditions"></div>
        <input id="room-view-search" class="room-view-search" type="search"
               placeholder="Поиск в комнате…" autocomplete="off">
      </div>
      <div id="room-view-list" class="room-view-list"></div>
    </section>

    <div id="requests-container" class="hidden" style="padding:16px;max-width:800px;margin:0 auto;">
      <div style="margin-bottom:16px;display:flex;align-items:center;gap:12px;">
        <h3 style="margin:0;font-size:18px;">Запросы владельца</h3>
        <select id="requests-status-filter" style="padding:6px 12px;border:1px solid #ddd;border-radius:4px;font-size:13px;">
          <option value="">Все статусы</option>
          <option value="pending">⏳ Ожидает</option>
          <option value="accepted">🔄 Принят</option>
          <option value="completed">✅ Выполнен</option>
          <option value="rejected">❌ Отклонён</option>
        </select>
      </div>
      <div id="requests-cards"></div>
    </div>

  </main>

  <!-- Footer with legend and stats -->
  <footer class="footer">
    <div class="legend" id="legend">
      <!-- Populated from JS -->
    </div>
    <div class="stats" id="stats">
      Loading...
    </div>
  </footer>

  <!-- Photo modal -->
  <div class="modal hidden" id="photo-modal">
    <div class="modal-content">
      <button class="modal-close" id="modal-close" type="button" aria-label="Close">×</button>
      <img id="modal-photo" src="" alt="Photo">
    </div>
  </div>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox-overlay">
    <button class="lightbox-close" id="lightbox-close" type="button" aria-label="Close">×</button>
    <button class="lightbox-nav lightbox-prev" id="lightbox-prev" type="button" aria-label="Previous">&#8249;</button>
    <div class="lightbox-img-wrap">
      <img id="lightbox-img" src="" alt="Photo">
    </div>
    <button class="lightbox-nav lightbox-next" id="lightbox-next" type="button" aria-label="Next">&#8250;</button>
    <div class="lightbox-counter" id="lightbox-counter"></div>
  </div>

  <!-- Scripts -->
  <script src="js/config.js?v=3"></script>
  <script src="js/api.js?v=3"></script>
  <script src="js/map.js?v=3"></script>
  <script src="js/app.js?v=3"></script>
</body>
</html>
