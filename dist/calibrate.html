<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Villa 9 — Pin Calibration Tool</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #1a1a2e;
    color: #e0e0e0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ─── Header ─── */
  .header {
    background: #16213e;
    padding: 8px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid #0f3460;
    flex-shrink: 0;
  }
  .header h1 {
    font-size: 16px;
    font-weight: 600;
    color: #e94560;
    white-space: nowrap;
  }
  .header select, .header input, .header button {
    padding: 6px 10px;
    border-radius: 4px;
    border: 1px solid #0f3460;
    background: #1a1a2e;
    color: #e0e0e0;
    font-size: 13px;
  }
  .header button {
    cursor: pointer;
    background: #0f3460;
    border-color: #e94560;
    transition: background 0.2s;
  }
  .header button:hover { background: #e94560; }
  .header button.export-btn { background: #2d6a4f; border-color: #52b788; }
  .header button.export-btn:hover { background: #52b788; color: #1a1a2e; }
  .header .status {
    margin-left: auto;
    font-size: 12px;
    color: #888;
  }
  .header .status .count { color: #52b788; font-weight: bold; }

  /* ─── Main layout ─── */
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ─── Sidebar ─── */
  .sidebar {
    width: 280px;
    background: #16213e;
    border-right: 1px solid #0f3460;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .sidebar-header {
    padding: 8px 12px;
    font-size: 12px;
    color: #888;
    border-bottom: 1px solid #0f3460;
    display: flex;
    justify-content: space-between;
  }
  .room-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 0;
  }
  .room-item {
    padding: 6px 12px;
    cursor: pointer;
    font-size: 13px;
    border-left: 3px solid transparent;
    transition: all 0.15s;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .room-item:hover { background: #1a1a2e; }
  .room-item.active { background: #0f3460; border-left-color: #e94560; }
  .room-item.has-pin { border-left-color: #52b788; }
  .room-item.has-pin .pin-badge {
    background: #2d6a4f;
    color: #52b788;
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 8px;
  }
  .room-item .room-code {
    color: #e94560;
    font-weight: 600;
    font-size: 11px;
    margin-right: 6px;
  }
  .room-item .room-name {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .zone-separator {
    padding: 4px 12px;
    font-size: 11px;
    color: #e94560;
    font-weight: 700;
    background: #1a1a2e;
    border-top: 1px solid #0f3460;
    margin-top: 4px;
  }

  /* ─── Map area ─── */
  .map-area {
    flex: 1;
    overflow: auto;
    position: relative;
    cursor: crosshair;
  }
  .map-container {
    position: relative;
    display: inline-block;
  }
  .map-container img {
    display: block;
    max-width: none;
  }
  
  /* Pins */
  .pin {
    position: absolute;
    width: 20px;
    height: 20px;
    margin-left: -10px;
    margin-top: -10px;
    border-radius: 50%;
    background: #e94560;
    border: 2px solid #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    cursor: pointer;
    z-index: 10;
    transition: transform 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 8px;
    font-weight: bold;
    color: #fff;
  }
  .pin:hover { transform: scale(1.4); z-index: 20; }
  .pin.active-pin { background: #52b788; transform: scale(1.3); }
  
  .pin-tooltip {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: #16213e;
    color: #e0e0e0;
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 11px;
    white-space: nowrap;
    pointer-events: none;
    display: none;
    border: 1px solid #0f3460;
  }
  .pin:hover .pin-tooltip { display: block; }

  /* ─── Instructions ─── */
  .instructions {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: #16213e;
    border: 1px solid #0f3460;
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 12px;
    color: #888;
    z-index: 100;
    text-align: center;
  }
  .instructions kbd {
    background: #0f3460;
    padding: 1px 5px;
    border-radius: 3px;
    color: #e94560;
  }

  /* Zoom controls */
  .zoom-controls {
    position: fixed;
    bottom: 60px;
    right: 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    z-index: 100;
  }
  .zoom-controls button {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid #0f3460;
    background: #16213e;
    color: #e0e0e0;
    font-size: 18px;
    cursor: pointer;
  }
  .zoom-controls button:hover { background: #0f3460; }
</style>
</head>
<body>

<div class="header">
  <h1>📍 Pin Calibration</h1>
  <label>Building:
    <select id="buildingSelect"></select>
  </label>
  <label>Floor plan:
    <select id="planSelect">
      <option value="assets/floor-plan-mc-1f.png">MC</option>
      <option value="assets/floor-plan-mv-1f.png">MV Living</option>
      <option value="assets/floor-plan-mv-2f.png">MV Spa</option>
      <option value="assets/floor-plan-sg-lower.png">SG Lower</option>
      <option value="assets/floor-plan-sg-upper.png">SG Upper</option>
      <option value="assets/floor-plan-ent.png">ENT</option>
    </select>
  </label>
  <label>API URL:
    <input id="apiUrl" type="text" style="width:320px" placeholder="https://script.google.com/macros/s/.../exec">
  </label>
  <button onclick="loadData()">Load</button>
  <button class="export-btn" onclick="exportCSV()">📥 Export CSV</button>
  <button onclick="clearAllPins()">🗑 Clear All</button>
  <div class="status">
    Rooms: <span class="count" id="totalCount">0</span> | 
    Pinned: <span class="count" id="pinnedCount">0</span>
  </div>
</div>

<div class="main">
  <div class="sidebar">
    <div class="sidebar-header">
      <span>Rooms</span>
      <span id="filterInfo">all</span>
    </div>
    <div class="room-list" id="roomList"></div>
  </div>
  <div class="map-area" id="mapArea">
    <div class="map-container" id="mapContainer">
      <img id="floorPlanImg" src="" alt="Floor Plan">
    </div>
  </div>
</div>

<div class="zoom-controls">
  <button onclick="zoom(0.1)">+</button>
  <button onclick="zoom(-0.1)">−</button>
  <button onclick="zoomReset()">⟲</button>
</div>

<div class="instructions">
  Select room in sidebar → click on plan to place pin | 
  <kbd>Del</kbd> remove pin | 
  <kbd>↑↓</kbd> navigate rooms |
  Export CSV → paste Pin_X, Pin_Y into Sheets
</div>

<script>
// ─── State ───
let rooms = [];
let zones = {};
let buildings = [];
let pins = {};  // room_id -> {x, y}
let selectedRoomId = null;
let currentBuildingId = null;
let currentZoneFilter = null;
let currentScale = 1;

// ─── Config mapping (tab -> building_id + zoneFilter) ───
const TAB_CONFIG = {
  'assets/floor-plan-mc-1f.png':    { buildingId: 1, zoneFilter: null,  label: 'MC' },
  'assets/floor-plan-mv-1f.png':    { buildingId: 2, zoneFilter: 201,   label: 'MV Living' },
  'assets/floor-plan-mv-2f.png':    { buildingId: 2, zoneFilter: 202,   label: 'MV Spa' },
  'assets/floor-plan-sg-lower.png': { buildingId: 3, zoneFilter: 301,   label: 'SG Lower' },
  'assets/floor-plan-sg-upper.png': { buildingId: 3, zoneFilter: 302,   label: 'SG Upper' },
  'assets/floor-plan-ent.png':      { buildingId: 6, zoneFilter: null,  label: 'ENT' },
};

// ─── Load data from API ───
async function loadData() {
  const url = document.getElementById('apiUrl').value.trim();
  if (!url) { alert('Enter API URL'); return; }
  
  try {
    const resp = await fetch(url + '?action=getAll');
    const data = await resp.json();
    
    rooms = data.rooms || [];
    buildings = data.buildings || [];
    
    // Load saved pins from localStorage
    const saved = localStorage.getItem('villa_pins');
    if (saved) pins = JSON.parse(saved);
    
    // Also load pins from API data (existing Pin_X/Pin_Y)
    rooms.forEach(r => {
      if (r.pin_x && r.pin_y && !pins[r.id]) {
        pins[r.id] = { x: Number(r.pin_x), y: Number(r.pin_y) };
      }
    });
    
    onPlanChange();
  } catch(e) {
    alert('Error: ' + e.message);
  }
}

// ─── Plan change ───
function onPlanChange() {
  const plan = document.getElementById('planSelect').value;
  const config = TAB_CONFIG[plan];
  if (!config) return;
  
  currentBuildingId = config.buildingId;
  currentZoneFilter = config.zoneFilter;
  
  // Load image
  const img = document.getElementById('floorPlanImg');
  img.src = plan;
  currentScale = 1;
  document.getElementById('mapContainer').style.transform = '';
  
  renderRoomList();
  renderPins();
}

// ─── Render room list ───
function renderRoomList() {
  const list = document.getElementById('roomList');
  list.innerHTML = '';
  
  const filtered = rooms.filter(r => {
    if (Number(r.zone_id) === 0) return false;
    // Find zone's building
    const matchesBuilding = rooms.some(rm => 
      rm.zone_id === r.zone_id
    );
    // Filter by building + zone
    if (currentZoneFilter) {
      return Number(r.zone_id) === currentZoneFilter;
    }
    // Group zones by building — need to check zone belongs to building
    // Simple approach: zone_id ranges
    return getZoneBuildingId(Number(r.zone_id)) === currentBuildingId;
  });
  
  // Group by zone
  const grouped = {};
  filtered.forEach(r => {
    const zid = r.zone_id;
    if (!grouped[zid]) grouped[zid] = [];
    grouped[zid].push(r);
  });
  
  let total = 0;
  let pinned = 0;
  
  Object.keys(grouped).sort((a,b) => Number(a) - Number(b)).forEach(zid => {
    const zoneRooms = grouped[zid];
    
    zoneRooms.forEach(r => {
      total++;
      const hasPin = !!pins[r.id];
      if (hasPin) pinned++;
      
      const div = document.createElement('div');
      div.className = 'room-item' + (hasPin ? ' has-pin' : '') + (r.id === selectedRoomId ? ' active' : '');
      div.innerHTML = `
        <span class="room-code">${r.code || ''}</span>
        <span class="room-name">${r.name}</span>
        ${hasPin ? '<span class="pin-badge">✓</span>' : ''}
      `;
      div.onclick = () => selectRoom(r.id);
      list.appendChild(div);
    });
  });
  
  document.getElementById('totalCount').textContent = total;
  document.getElementById('pinnedCount').textContent = pinned;
  document.getElementById('filterInfo').textContent = 
    `${pinned}/${total} pinned`;
}

// ─── Zone → Building mapping ───
function getZoneBuildingId(zoneId) {
  // Based on our ID scheme: 1xx=1, 2xx=2, 3xx=3, 4xx=4, 5xx=5, 6xx=6, 7xx=7, 8xx=8
  return Math.floor(zoneId / 100);
}

// ─── Select room ───
function selectRoom(roomId) {
  selectedRoomId = roomId;
  renderRoomList();
  renderPins();
  
  // Scroll to pin if exists
  if (pins[roomId]) {
    const pin = document.querySelector(`.pin[data-room="${roomId}"]`);
    if (pin) pin.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

// ─── Click on map ───
document.getElementById('mapArea').addEventListener('click', function(e) {
  if (!selectedRoomId) return;
  if (e.target.classList.contains('pin')) return;
  
  const img = document.getElementById('floorPlanImg');
  const rect = img.getBoundingClientRect();
  
  // Calculate position relative to natural image size
  const scaleX = img.naturalWidth / rect.width;
  const scaleY = img.naturalHeight / rect.height;
  
  const x = Math.round((e.clientX - rect.left) * scaleX);
  const y = Math.round((e.clientY - rect.top) * scaleY);
  
  pins[selectedRoomId] = { x, y };
  savePins();
  
  // Auto-advance to next unpinned room
  advanceToNext();
  
  renderRoomList();
  renderPins();
});

// ─── Render pins on map ───
function renderPins() {
  // Remove existing pins
  document.querySelectorAll('.pin').forEach(p => p.remove());
  
  const img = document.getElementById('floorPlanImg');
  const container = document.getElementById('mapContainer');
  
  if (!img.naturalWidth) {
    img.onload = () => renderPins();
    return;
  }
  
  const displayW = img.clientWidth;
  const displayH = img.clientHeight;
  
  Object.keys(pins).forEach(roomId => {
    const rid = Number(roomId);
    const room = rooms.find(r => r.id === rid);
    if (!room) return;
    
    // Check if room belongs to current view
    if (currentZoneFilter && Number(room.zone_id) !== currentZoneFilter) return;
    if (!currentZoneFilter && getZoneBuildingId(Number(room.zone_id)) !== currentBuildingId) return;
    
    const pin = pins[rid];
    const px = (pin.x / img.naturalWidth) * displayW;
    const py = (pin.y / img.naturalHeight) * displayH;
    
    const el = document.createElement('div');
    el.className = 'pin' + (rid === selectedRoomId ? ' active-pin' : '');
    el.dataset.room = rid;
    el.style.left = px + 'px';
    el.style.top = py + 'px';
    el.innerHTML = `<span class="pin-tooltip">${room.code || room.name}</span>`;
    el.onclick = (e) => { e.stopPropagation(); selectRoom(rid); };
    container.appendChild(el);
  });
}

// ─── Auto advance to next unpinned room ───
function advanceToNext() {
  const filtered = rooms.filter(r => {
    if (currentZoneFilter) return Number(r.zone_id) === currentZoneFilter;
    return getZoneBuildingId(Number(r.zone_id)) === currentBuildingId;
  });
  
  const currentIdx = filtered.findIndex(r => r.id === selectedRoomId);
  for (let i = currentIdx + 1; i < filtered.length; i++) {
    if (!pins[filtered[i].id]) {
      selectedRoomId = filtered[i].id;
      return;
    }
  }
}

// ─── Keyboard ───
document.addEventListener('keydown', function(e) {
  if (e.key === 'Delete' && selectedRoomId && pins[selectedRoomId]) {
    delete pins[selectedRoomId];
    savePins();
    renderRoomList();
    renderPins();
  }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    const filtered = rooms.filter(r => {
      if (currentZoneFilter) return Number(r.zone_id) === currentZoneFilter;
      return getZoneBuildingId(Number(r.zone_id)) === currentBuildingId;
    });
    const idx = filtered.findIndex(r => r.id === selectedRoomId);
    const next = e.key === 'ArrowDown' ? idx + 1 : idx - 1;
    if (next >= 0 && next < filtered.length) {
      selectRoom(filtered[next].id);
    }
  }
});

// ─── Zoom ───
function zoom(delta) {
  currentScale = Math.max(0.3, Math.min(3, currentScale + delta));
  document.getElementById('floorPlanImg').style.transform = `scale(${currentScale})`;
  document.getElementById('floorPlanImg').style.transformOrigin = 'top left';
  // Re-render pins at new scale
  setTimeout(renderPins, 50);
}
function zoomReset() {
  currentScale = 1;
  document.getElementById('floorPlanImg').style.transform = '';
  setTimeout(renderPins, 50);
}

// ─── Save/Load pins ───
function savePins() {
  localStorage.setItem('villa_pins', JSON.stringify(pins));
}

function clearAllPins() {
  if (!confirm('Clear ALL pins? This cannot be undone.')) return;
  pins = {};
  savePins();
  renderRoomList();
  renderPins();
}

// ─── Export CSV ───
function exportCSV() {
  let csv = 'ID,Номер,Название,Pin_X,Pin_Y\n';
  
  rooms.forEach(r => {
    if (pins[r.id]) {
      csv += `${r.id},${r.code},${r.name},${pins[r.id].x},${pins[r.id].y}\n`;
    }
  });
  
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'pin_coordinates.csv';
  a.click();
  URL.revokeObjectURL(url);
}

// ─── Plan select change ───
document.getElementById('planSelect').addEventListener('change', onPlanChange);

// ─── Window resize ───
window.addEventListener('resize', () => setTimeout(renderPins, 100));

// ─── Init: try to load saved API URL ───
(function() {
  const savedUrl = localStorage.getItem('villa_api_url');
  if (savedUrl) document.getElementById('apiUrl').value = savedUrl;
  
  // Save URL on load
  document.querySelector('button').addEventListener('click', () => {
    localStorage.setItem('villa_api_url', document.getElementById('apiUrl').value.trim());
  });
})();
</script>
</body>
</html>
